version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ibnsino_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ibnsino}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ibnsino_password}
      POSTGRES_DB: ${POSTGRES_DB:-ibnsino_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ibnsino} -d ${POSTGRES_DB:-ibnsino_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ibnsino_bot
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-ibnsino}:${POSTGRES_PASSWORD:-ibnsino_password}@postgres:5432/${POSTGRES_DB:-ibnsino_db}
    volumes:
      - .:/app
    command: >
      sh -c "alembic upgrade head && python -m bot.main"

volumes:
  postgres_data:
